name: Build & Auto-Release VYRO MUSIC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Permanent Signing Keystore
        env:
          VYRO_KEYSTORE_B64: ${{ secrets.VYRO_KEYSTORE_B64 }}
          SECRET_PASS: ${{ secrets.VYRO_KEY_PASS }}
        run: |
          if [ -n "$VYRO_KEYSTORE_B64" ]; then
            printf '%s' "$VYRO_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > app/vyro.jks
            PASS=$(printf '%s' "${SECRET_PASS:-vyro2026}" | tr -d '\n\r ')
            keytool -list -keystore app/vyro.jks -storepass "$PASS" > /dev/null
            echo "Keystore decoded and verified successfully!"
          fi

      - name: Build Signed APK
        env:
          SECRET_PASS: ${{ secrets.VYRO_KEY_PASS }}
        run: |
          export VYRO_KEY_PASS=$(printf '%s' "${SECRET_PASS:-vyro2026}" | tr -d '\n\r ')
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Extract Version, Rename APK & Read What's New
        id: meta
        run: |
          VERSION=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION="${VERSION:-5.0.0-TITAN}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          OUT_APK="VYRO_MUSIC_v${VERSION}.apk"
          cp "$APK_PATH" "$OUT_APK"
          echo "apk_file=$OUT_APK" >> "$GITHUB_OUTPUT"

          if [ -f "whats_new.txt" ] && [ -s "whats_new.txt" ]; then
            cp whats_new.txt release_notes.md
          else
            echo "تحديث جديد من VYRO MUSIC:" > release_notes.md
            git log -n 5 --pretty=format:"• %s" >> release_notes.md
          fi

      - name: Upload VYRO MUSIC APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRO_MUSIC_v${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.apk_file }}

      - name: Publish Auto-Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: VYRO MUSIC v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          files: ${{ steps.meta.outputs.apk_file }}
