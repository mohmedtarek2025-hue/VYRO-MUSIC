name: Build & Auto-Release VYRO MUSIC

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Permanent Signing Keystore
        if: ${{ secrets.VYRO_KEYSTORE_B64 != '' }}
        env:
          VYRO_KEYSTORE_B64: ${{ secrets.VYRO_KEYSTORE_B64 }}
        run: |
          echo "$VYRO_KEYSTORE_B64" | tr -d '\n\r ' | base64 --decode > app/vyro.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed APK
        env:
          SECRET_PASS: ${{ secrets.VYRO_KEY_PASS }}
        run: |
          export VYRO_KEY_PASS="${SECRET_PASS:-vyro2026}"
          ./gradlew assembleDebug

      - name: Extract Version, Rename APK & Read What's New
        id: meta
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          OUT_APK="VYRO_MUSIC_v${VERSION}.apk"
          cp "$APK_PATH" "$OUT_APK"
          echo "apk_file=$OUT_APK" >> $GITHUB_OUTPUT

          if [ -f "whats_new.txt" ] && [ -s "whats_new.txt" ]; then
            cp whats_new.txt release_notes.md
          else
            echo "تحديث جديد من VYRO MUSIC:" > release_notes.md
            git log -n 5 --pretty=format:"• %s" >> release_notes.md
          fi

      - name: Upload VYRO MUSIC APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRO_MUSIC_v${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.apk_file }}

      - name: Publish Auto-Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: VYRO MUSIC v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          files: ${{ steps.meta.outputs.apk_file }}
          make_latest: true
